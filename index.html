<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 年度航行日志 | LifeOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; }
        .serif { font-family: 'Noto Serif SC', serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
        .input-minimal { background: transparent; border-bottom: 1px solid #e2e8f0; transition: border-color 0.3s; }
        .input-minimal:focus { outline: none; border-color: var(--accent); }
        .progress-bar { transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body class="max-w-3xl mx-auto px-6 py-12 md:py-20">

    <header class="mb-20 animate-fade-in text-center">
        <h1 class="serif text-5xl mb-6 tracking-tight">二零二六 · 航行日志</h1>
        <p id="quote" class="text-gray-400 italic font-light">"凡是过往，皆为序章。"</p>
    </header>

    <section class="mb-20">
        <h2 class="serif text-2xl mb-8 flex items-center opacity-80">
            <span class="w-10 h-[1px] bg-slate-300 mr-4"></span> 往事回响 (2025)
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-3xl">
                <label class="text-[10px] uppercase tracking-widest text-slate-400 block mb-2">年度关键词</label>
                <input type="text" id="kw-2025" placeholder="例如：沉淀" class="input-minimal w-full py-1 text-lg">
            </div>
            <div class="glass p-6 rounded-3xl">
                <label class="text-[10px] uppercase tracking-widest text-slate-400 block mb-2">最自豪的成就</label>
                <input type="text" id="pride-2025" placeholder="达成了什么？" class="input-minimal w-full py-1 text-lg">
            </div>
            <div class="glass p-6 rounded-3xl">
                <label class="text-[10px] uppercase tracking-widest text-slate-400 block mb-2">未竟的遗憾</label>
                <input type="text" id="regret-2025" placeholder="下次如何改进？" class="input-minimal w-full py-1 text-lg">
            </div>
        </div>
    </section>

    <section class="mb-20">
        <div class="flex justify-between items-center mb-8">
            <h2 class="serif text-2xl flex items-center opacity-80">
                <span class="w-10 h-[1px] bg-blue-500 mr-4"></span> 目标海域 (2026)
            </h2>
            <button onclick="addGoal()" class="text-xs bg-slate-900 text-white px-5 py-2.5 rounded-full hover:scale-105 transition active:scale-95 shadow-lg shadow-slate-200">
                + 开启新航线
            </button>
        </div>

        <div id="goals-container" class="space-y-6">
            </div>
    </section>

    <footer class="mt-32 text-center opacity-30 hover:opacity-100 transition duration-1000">
        <p class="text-xs tracking-[0.2em]">LIFE OS / DESIGNED FOR 2026</p>
    </footer>

    <script>
        // --- 核心逻辑 ---

        let goals = JSON.parse(localStorage.getItem('myGoals2026')) || [
            { id: 1, title: '体脂率降至 18%', progress: 45, tag: '健康' },
            { id: 2, title: '建立 10W 应急基金', progress: 20, tag: '财务' }
        ];

        // 初始化
        window.onload = () => {
            renderGoals();
            loadReviews();
            // 自动保存复盘内容
            ['kw-2025', 'pride-2025', 'regret-2025'].forEach(id => {
                document.getElementById(id).addEventListener('input', (e) => {
                    localStorage.setItem(id, e.target.value);
                });
            });
        };

        function loadReviews() {
            ['kw-2025', 'pride-2025', 'regret-2025'].forEach(id => {
                document.getElementById(id).value = localStorage.getItem(id) || '';
            });
        }

        function renderGoals() {
            const container = document.getElementById('goals-container');
            container.innerHTML = goals.map(goal => `
                <div class="glass p-7 rounded-[2rem] group hover:shadow-xl hover:shadow-slate-200/50 transition-all duration-500">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex-1">
                            <span class="text-[10px] font-bold text-blue-500 bg-blue-50 px-2 py-0.5 rounded-md mb-2 inline-block">${goal.tag}</span>
                            <h3 class="text-xl font-medium block">${goal.title}</h3>
                        </div>
                        <div class="flex items-center space-x-6">
                            <div class="flex flex-col items-end">
                                <div class="w-48 bg-slate-100 h-1.5 rounded-full overflow-hidden mb-2">
                                    <div class="progress-bar bg-blue-500 h-full" style="width: ${goal.progress}%"></div>
                                </div>
                                <div class="flex items-center gap-3">
                                    <input type="range" value="${goal.progress}" 
                                           oninput="updateProgress(${goal.id}, this.value)"
                                           class="w-24 h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-500">
                                    <span class="text-sm font-mono text-slate-400 w-8 text-right">${goal.progress}%</span>
                                </div>
                            </div>
                            <button onclick="removeGoal(${goal.id})" class="text-slate-200 hover:text-red-400 transition">✕</button>
                        </div>
                    </div>
                </div>
            `).join('');
            localStorage.setItem('myGoals2026', JSON.stringify(goals));
        }

        function addGoal() {
            const title = prompt("输入你的新目标：");
            if (title) {
                goals.push({
                    id: Date.now(),
                    title: title,
                    progress: 0,
                    tag: '探索'
                });
                renderGoals();
            }
        }

        function updateProgress(id, val) {
            const goal = goals.find(g => g.id === id);
            if (goal) {
                goal.progress = val;
                renderGoals();
            }
        }

        function removeGoal(id) {
            if(confirm('确定取消这条航线吗？')) {
                goals = goals.filter(g => g.id !== id);
                renderGoals();
            }
        }
    </script>
</body>
</html>
